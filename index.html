/* Mission content v2: briefing, quick bonus, tick list, hangman, spelling, context panels, evidence, reply */
.briefing-plain{margin-bottom:22px}
.briefing-plain h3{font-size:10px;letter-spacing:.1em;color:var(--cyan);margin:0 0 9px}
.briefing-plain h3+p{margin-bottom:18px}
.briefing-plain p{font-size:14px;line-height:1.8;color:#c4cfdd}
.briefing-plain small{display:block;margin-top:14px;color:var(--muted);font-size:11px;line-height:1.7}
.how-list{margin:0;padding-left:20px;display:grid;gap:5px;font-size:13px;line-height:1.7;color:#aebccc}
.quick-chip.closed{color:var(--muted);border-color:var(--line);background:transparent}
.memory-list{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;padding:22px;border:1px dashed #4c6051;border-radius:13px;background:#bcf57804;margin-bottom:20px}
.memory-list span{padding:9px 14px;border-radius:9px;background:#27392b;border:1px solid #728f55;color:#d1e4bf;font-size:14px}
.memory-list.small{justify-content:flex-start;align-items:center;padding:12px 14px;gap:7px}
.memory-list.small b{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-right:4px}
.memory-list.small span{font-size:12px;padding:5px 10px}
.tick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:18px}
.tick-item{display:flex;align-items:center;gap:11px;text-align:left;padding:13px 14px;min-height:54px;border:1px solid #334055;background:#172131;border-radius:12px;font-size:14px}
.tick-item:hover{border-color:#849d6d}
.tick-item.ticked{border-color:#a0cd71;background:#bcf57811;color:#d9edc6}
.tick-box{width:22px;height:22px;flex-shrink:0;display:grid;place-items:center;border:1px solid #4b5a70;border-radius:6px;color:var(--lime)}
.tick-box .icon{width:15px;height:15px}
.tick-item.ticked .tick-box{border-color:#749b4f;background:#bcf5781a}
.sort-categories.three{grid-template-columns:repeat(3,1fr)}
.hang-word,.letter-boxes{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:8px 0 18px}
.hang-word span,.letter-boxes span{width:38px;height:46px;display:grid;place-items:center;border-bottom:3px solid #4c6051;background:#172131;border-radius:7px 7px 3px 3px;font-size:21px;font-weight:700;letter-spacing:0}
.hang-word span.shown{border-color:var(--lime);color:#d9edc6}
.hang-word .gap,.letter-boxes .gap{width:16px;background:none;border:0}
.letter-boxes span.blank{border-color:var(--cyan);color:var(--cyan)}
.letter-boxes.scramble span{background:#243246;border:1px solid #44546b;border-radius:8px;color:var(--amber)}
.letter-count{text-align:center;font-size:11px;color:var(--muted);margin:-8px 0 16px}
.hang-lives{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.hang-lives i{width:9px;height:9px;border-radius:50%;background:var(--lime)}
.hang-lives i.used{background:var(--danger)}
.letter-pad{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;max-width:520px;margin:0 auto}
.letter-pad button{min-height:42px;border-radius:8px;border:1px solid #44546b;background:#243246;font-weight:650}
.letter-pad button:hover:not(:disabled){border-color:var(--lime)}
.letter-pad button.hit{background:#bcf57818;border-color:#749b4f;color:var(--lime)}
.letter-pad button.miss{opacity:.35}
.spell-form{display:flex;gap:10px;max-width:520px;margin:0 auto}
.spell-form .text-input{text-transform:uppercase;letter-spacing:.08em;font-size:16px}
.spell-form .button{flex-shrink:0}
.dialogue{padding:14px 18px;border:1px solid #3e4954;border-left:3px solid var(--violet);border-radius:0 12px 12px 0;background:#1a2133;margin:0 0 20px;display:grid;gap:7px}
.dialogue p{font-size:13px;line-height:1.7;color:#d6e0e8}
.dialogue b{color:var(--violet);font-weight:650}
.record-list{list-style:none;margin:0 0 20px;padding:14px 18px;border:1px solid #3e4954;border-left:3px solid var(--cyan);border-radius:0 12px 12px 0;background:#172330;display:grid;gap:6px}
.record-list li{font-size:13px;line-height:1.6;color:#d6e0e8}
.record-pair{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px}
.record-card h4{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.record-card .record-list{margin:0}
.table-wrap{overflow-x:auto;margin-bottom:20px;border:1px solid #3e4954;border-radius:12px}
.evidence-table{border-collapse:collapse;width:100%;font-size:12px;min-width:460px}
.evidence-table th{text-align:left;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--cyan);background:#172330;padding:10px 12px}
.evidence-table td{padding:10px 12px;border-top:1px solid var(--line);color:#d6e0e8;line-height:1.5}
.evidence-table td:first-child{font-weight:650;color:var(--text)}
.word-build.lines,.word-bank.lines{flex-direction:column;align-items:stretch}
.line-token{text-align:left;line-height:1.5}
.line-token b{color:var(--lime);margin-right:6px}
.xp-breakdown{font-size:11px;color:var(--muted);margin:8px 0 18px}
.debrief .callout{text-align:left;max-width:580px;margin:0 auto 18px}
.evidence-card{text-align:left;max-width:580px;margin:0 auto 20px;padding:16px 18px;border:1px solid #f2c27740;border-left:3px solid var(--amber);border-radius:0 12px 12px 0;background:#f2c2770a}
.evidence-card .passage-label{color:var(--amber);margin-bottom:8px}
.evidence-card p{font-size:14px;line-height:1.8;color:#eadbc0}
.debrief-chat{margin-top:6px}
.chat-message.me{justify-content:flex-end}
.chat-message.me>div{max-width:85%}
.chat-message.me .chat-name{color:var(--lime);text-align:right}
.chat-message.me .chat-bubble{border-radius:10px 0 10px 10px;background:#22331f;border-color:#46603a;color:#d1e4bf}
.reply-form{display:flex;gap:10px;max-width:580px;margin:18px auto 0}
.debrief .reply-form .button{margin-top:0;min-width:0}
.lock-sequence{text-align:left;max-width:390px;margin:18px auto 0;padding:14px 18px;border:1px solid #bcb0fd30;border-radius:12px;background:#bcb0fd08}
.lock-sequence .passage-label{color:var(--violet);margin-bottom:8px}
.lock-sequence ol{margin:0;padding-left:20px;display:grid;gap:4px;font-size:13px;color:#d6e0e8}
/* Memory Cards: face-down flip cards */
.mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 18px}
.mem-card{perspective:800px;height:118px;padding:0;border:0;background:none;border-radius:12px}
.mem-inner{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mem-card.open .mem-inner{transform:rotateY(180deg)}
.mem-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;text-align:center;line-height:1.35}
.mem-back{background:repeating-linear-gradient(45deg,#1d2a3d 0 8px,#22324a 8px 16px);border:1px solid #3b4c65;color:var(--cyan)}
.mem-card.right .mem-back{color:var(--violet)}
.mem-back .icon{width:24px;height:24px}
.mem-back small{font-size:9px;letter-spacing:.14em;font-weight:700}
.mem-front{transform:rotateY(180deg);background:#eef3ea;color:#1b2533;border:1px solid #cfdcc4;font-size:13px;font-weight:600}
.mem-card.left .mem-front{font-size:16px;font-weight:750}
.mem-card.matched .mem-front{background:#d9f5bd;border-color:#8fc95c}
.mem-card:not(:disabled):hover .mem-back{border-color:var(--lime)}
.mem-card:disabled{opacity:1;cursor:default}
/* Speed Sort: drag and drop */
.sort-pool{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;min-height:64px;padding:14px;border:1px dashed #4c6051;border-radius:13px;background:#bcf57804;margin-bottom:16px;align-items:center}
.sort-empty,.sort-hint{font-size:11px;color:var(--muted)}
.sort-chip{display:inline-flex;align-items:center;gap:6px;padding:10px 15px;min-height:44px;border-radius:9px;border:1px solid #44546b;background:#243246;font-size:14px;cursor:grab;box-shadow:0 3px 0 #0003}
.sort-chip.selected{border-color:var(--lime);background:#2c3e2b;outline:2px solid #bcf57855}
.sort-chip.locked{border-color:#749b4f;background:#bcf57814;color:#d9edc6;cursor:default;box-shadow:none}
.sort-chip .icon{width:14px;height:14px;color:var(--lime)}
.sort-zones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.sort-zones.three{grid-template-columns:repeat(3,1fr)}
.sort-zone{border:1px solid #43533b;border-radius:12px;background:#bcf57805;overflow:hidden}
.sort-zone.drag-over,.sort-pool.drag-over{border-color:var(--lime);background:#bcf57814}
.sort-zone-head{width:100%;display:flex;align-items:center;gap:10px;padding:13px 14px;font-size:14px;font-weight:650;border-bottom:1px solid #43533b;text-align:left}
.sort-zone-head span{flex:1}
.sort-zone-head .icon{width:18px;height:18px;color:var(--lime)}
.sort-zone-head small{font:10px ui-monospace,monospace;color:var(--muted);border:1px solid var(--line);padding:2px 6px;border-radius:5px}
.sort-zone-body{display:flex;flex-wrap:wrap;gap:8px;padding:12px;min-height:92px;align-content:flex-start}
/* Crossword grid */
.cw-layout{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:start;margin-bottom:16px}
.cw-grid{display:grid;grid-template-columns:repeat(var(--cols),34px);grid-auto-rows:34px;gap:2px;overflow-x:auto;max-width:100%}
.cw-blank{background:transparent}
.cw-cell{position:relative;background:#eef3ea;border-radius:3px;display:block}
.cw-cell b{position:absolute;top:1px;left:2px;font-size:8px;line-height:1;color:#44546b;pointer-events:none}
.cw-cell input{width:100%;height:100%;border:0;background:transparent;text-align:center;font-size:17px;font-weight:750;text-transform:uppercase;color:#1b2533;padding:6px 0 0;outline:none;border-radius:3px}
.cw-cell input:focus{background:#fff6c9;box-shadow:inset 0 0 0 2px var(--amber)}
.cw-cell.done{background:#d9f5bd}
.cw-cell.wrong{background:#ffd9d9}
.cw-clues{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.cw-clue{text-align:left;width:100%;padding:9px 11px;border:1px solid #334055;border-radius:9px;background:#172131;font-size:12px;line-height:1.55;color:#c4cfdd}
.cw-clue b{color:var(--cyan);margin-right:4px}
.cw-clue small{color:var(--muted)}
.cw-clues li.done .cw-clue{border-color:#749b4f;color:#d9edc6}
.cw-clues li.wrong .cw-clue{border-color:#ad686e}
/* Clock Challenge analog clock */
.clock-wrap{display:flex;justify-content:center;margin:4px 0 18px}
.analog-clock{width:190px;height:190px}
.clock-face{fill:#f4f6f2;stroke:#8bd9d2;stroke-width:2.2}
.clock-marks line{stroke:#273548}
.clock-nums text{font-size:8.5px;font-weight:700;text-anchor:middle;fill:#1b2533;font-family:inherit}
.clock-hour{stroke:#1b2533;stroke-width:3.4;stroke-linecap:round}
.clock-minute{stroke:#2f6f8f;stroke-width:2.2;stroke-linecap:round}
.clock-pin{fill:#c0392b}
/* Missing Letter: type directly into the blanks */
.blank-input{width:38px;height:46px;border:0;border-bottom:3px solid var(--cyan);border-radius:7px 7px 3px 3px;background:#1c2a3a;color:var(--cyan);text-align:center;font-size:21px;font-weight:700;text-transform:uppercase;outline:none}
.blank-input:focus{background:#24384c;box-shadow:0 0 0 2px #8bd9d255}
.letter-boxes span.solved{color:var(--lime);border-color:var(--lime)}
.letter-boxes .letter-word{display:inline-flex;gap:7px;width:auto;height:auto;background:none;border:0;border-radius:0}
.letter-boxes .letter-word+.letter-word{margin-left:14px}
.memory-note{display:flex;gap:9px;align-items:flex-start;font-size:12px;line-height:1.6;color:#eadbc0;background:#f2c2770a;border:1px solid #f2c27740;border-radius:10px;padding:11px 13px;margin:0 0 18px}
.memory-note .icon{width:16px;height:16px;flex-shrink:0;color:var(--amber);margin-top:2px}
.escape-brief{text-align:left;max-width:440px;margin:16px auto 0}
.escape-brief .chat-bubble{font-size:12px}
@media(max-width:700px){
  .mem-grid{grid-template-columns:1fr 1fr}
  .mem-card{height:104px}
  .sort-zones,.sort-zones.three{grid-template-columns:1fr}
  .cw-layout{grid-template-columns:1fr}
  .cw-grid{grid-template-columns:repeat(var(--cols),minmax(0,30px));grid-auto-rows:30px}
  .blank-input{width:30px;height:40px;font-size:17px}
  .sort-categories.three,.record-pair{grid-template-columns:1fr}
  .letter-pad{grid-template-columns:repeat(7,1fr)}
  .hang-word span,.letter-boxes span{width:30px;height:40px;font-size:17px}
  .spell-form,.reply-form{flex-direction:column}
  .tick-grid{grid-template-columns:1fr 1fr}
  .tick-item{font-size:12px;padding:11px}
}
</style>
</head>

  <script>

  // ---------------------------------------------------------------- SCHOOL
  const school = {

        ]
      },
      {
        number: 4, title: 'Error Analysis + Correction', location: 'Project Room and Computer Room',
        brief: 'Find who changed the project file and which information does not match the original instructions.',

        before: 'Agent, investigate the school records carefully. Corrected messages, reports, and witness statements may help us understand the incident.',
        msgs: [null, 'Good work! Accurate statements are important. Keep checking the evidence for inconsistencies.', null, 'Interesting message, Agent! Read the details carefully before deciding what they mean.', null],
        after: 'All five Mini Games are complete. Recall the hidden numbers announced by the AI and keep their original order.',
        escape: 'The Escape Stage requires three digits. Enter the digits in the order you received them after the Mini Games. You have three attempts.',
        games: [
          { type: 'quiz', title: 'Spot the Error', caption: 'Correct the instructions', steps: STEPS.error,
            situation: 'You check the project instructions and find five sentences with grammar or vocabulary mistakes.',
            questions: [mc('“The student prepare the project.” Choose the correct sentence.', ['The student prepares the project.', 'The student preparing the project.', 'The student prepare the projects.'], 'A'), mc('“We discusses the assignment.” Choose the correct sentence.', ['We discuss the assignment.', 'We discussing the assignment.', 'We discuss the assignments yesterday.'], 'A'), mc('“The deadline are Friday.” Choose the correct sentence.', ['The deadline is Friday.', 'The deadline am Friday.', 'The deadline be Friday.'], 'A'), mc('“Please submit your file yesterday.” Choose the correct sentence.', ['Please submitted your file.', 'Please submit your file today.', 'Please submits your file yesterday.'], 'B'), mc('“She explain the presentation.” Choose the correct sentence.', ['She explains the presentation.', 'She explaining the presentation.', 'She explain presentations.'], 'A')] },
          { type: 'quiz', title: 'Fix the Dialogue', caption: 'Repair the conversations', steps: STEPS.dialogue,
            situation: 'You find three conversations between students working on a group project. Choose the correct reply for each one.',
            questions: [mc('Which reply is correct?', ['“Great. Let’s check it together.”', '“Great. Let’s checks it together.”', '“Great. Let’s checked it together.”'], 'A'), mc('Choose the best next reply.', ['“Please explain it to the group.”', '“Please explains it to the group.”', '“Please explaining it to the group.”'], 'A'), mc('Choose the best reply.', ['“Please correct it before the deadline.”', '“Please correcting it before the deadline.”', '“Please corrected it before the deadline.”'], 'A')].map((q, n) => ({ ...q, context: [['A', 'Have you prepared the presentation?', 'B', 'Yes, I finished it last night.'], ['A', 'Can you explain this part of the project?', 'B', 'Yes, I can.'], ['A', 'Did you submit the file?', 'B', 'Not yet. I need to correct it.']][n] })) },
          { type: 'quiz', title: 'Mission Briefing Fix', caption: 'Correct the briefing', steps: STEPS.briefing, hideContext: true,

  <script>
/* CODE BREAKERS guest UI. No external services, network assets, or authentication. */
(() => {
  'use strict';
  const D = window.CB_DATA, C = window.CB_CORE, V = window.CB_VISUAL;
  const $ = s => document.querySelector(s);
  const $$ = s => [...document.querySelectorAll(s)];
  const e = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const fmt = n => Number(n).toLocaleString('en-US');
  const i = V.icon;
  const KEY = 'codebreakers.guest.v1', ACTIVE_KEY = 'codebreakers.active.v1';
  let state = null, screen = 'entry', tab = 'maps', mapId = 'school', run = null, play = null;
  let boardTab = 'xp', boardMap = 'school', toastTimer, transferTimer, gameTimer, modalReturnFocus;
  let draftAvatar = null, draftName = '', storageOK = true, recoveryMessage = '', dialogMode = '';
  const app = $('#app'), modalRoot = $('#modal-root');
  function storageGet(key) { try { return localStorage.getItem(key); } catch { storageOK = false; return null; } }
  function storageSet(key, value) { try { localStorage.setItem(key, value); return true; } catch { storageOK = false; return false; } }
  function storageRemove(key) { try { localStorage.removeItem(key); } catch { storageOK = false; } }
  const saved = storageGet(KEY);
  if (saved) {
    try { state = C.validate(JSON.parse(saved)); }
    catch { recoveryMessage = 'The saved guest profile could not be read. A new local guest can be created.'; }
  }
  if (storageGet(ACTIVE_KEY)) {
    recoveryMessage = 'Your unfinished level was closed. Its pending XP was not saved; completed levels and your latest saved streak remain.';
    storageRemove(ACTIVE_KEY);
  }
  function save() {
    if (!state) return;
    state.updatedAt = new Date().toISOString();
    const wasOK = storageOK;
    storageSet(KEY, JSON.stringify(state));
    if (wasOK && !storageOK) toast('Browser saving is unavailable. Export progress before closing.', true);
  }
  function markActive() {
    if (run && !['success','failed'].includes(run.phase)) storageSet(ACTIVE_KEY, JSON.stringify({mapId:run.mapId, level:run.level}));
    else storageRemove(ACTIVE_KEY);
  }
  function toast(text, error=false) {
    clearTimeout(toastTimer);
    $('#toast-area').innerHTML = `<div class="toast ${error?'error':''}" role="status">${e(text)}</div>`;
    toastTimer = setTimeout(() => { $('#toast-area').innerHTML = ''; }, 4300);
  }
  function scrollTop() { window.scrollTo({top:0, behavior:'instant'}); }
  function shuffled(array) {
    const a = [...array];
    for (let n=a.length-1;n>0;n--) { const k=Math.floor(Math.random()*(n+1)); [a[n],a[k]]=[a[k],a[n]]; }
    return a;
  }
  function currentMap() { return D.maps.find(m=>m.id=== (run ? run.mapId : mapId)); }
  function currentLevel() { return currentMap().levels[run.level]; }
  function currentGame() { return currentLevel().games[run.gameIndex]; }
  function brand() { return `<span class="brand">${V.logo()}<span class="brand-text">CODE<br>BREAKERS<small>ENGLISH. ENCRYPTED.</small></span></span>`; }
  function storageWarning() { return storageOK ? '' : `<div class="storage-warning">Browser saving is unavailable. Keep this tab open and use <button data-action="settings">Export progress</button> before closing.</div>`; }
  function noticeLine() { return `<div class="lobby-footnote"><span>${i('shield')} Guest edition · School, Hotel & Hospital missions</span><span>${i('lock')} Saved only in this browser</span></div>`; }
  function entryHTML() {
    const a = state ? state.avatar : {shirt:0,hair:0,face:0,pants:0};
    return `<div class="entry">${storageWarning()}<header class="entry-header">${brand()}<span class="pill"><span class="status-dot"></span> GUEST EDITION / 01</span></header>
    <main class="entry-inner"><section class="entry-copy"><div class="eyebrow"><span class="status-dot"></span> YOUR ENGLISH. YOUR SECRET WEAPON.</div><h1>Every word<br>is a <span>clue.</span></h1><p class="entry-desc">Step into the field, follow the evidence, and crack the code. Your next mission starts with you.</p>
    <div class="guest-form"><div class="input-wrap"><label class="field-label" for="guest-name">AGENT NAME <span class="muted">/ optional</span></label><input class="text-input" id="guest-name" autocomplete="nickname" maxlength="24" placeholder="Guest Agent" value="${e(state?state.name:'')}" aria-describedby="guest-privacy"></div>
    <button class="button primary full" data-action="guest">${state?'Continue as guest':'Enter as guest'} ${i('arrow')}</button><p class="fine-print" id="guest-privacy">${i('shield')} No password. No sign-up. Your progress stays here.</p></div></section>
    <div class="entry-art" aria-hidden="true"><div class="radar"></div><div class="agent-frame">${V.avatar(a)}</div><div class="floating-note one"><small>Incoming transmission</small><strong>Welcome to the team.</strong><p>Nova & Zero are on your side.<br>The rest is up to you, Agent.</p></div><div class="floating-note three"><span class="status-dot"></span> <span class="mono" style="font-size:9px;color:var(--lime)">CHANNEL SECURE</span></div><div class="floating-note two"><small>One way out</small><div class="mini-code"><span>?</span><span>?</span><span>?</span></div><p>3 digits. One final decision.</p></div><span class="crosshair">${i('target')}</span><span class="scan-tag">AGENT 001 // GUEST CLEARANCE</span></div></main>
    <footer class="entry-bottom"><div class="entry-stats"><div><b>03</b><span>Mission maps</span></div><div><b>15</b><span>Levels to escape</span></div><div><b>75</b><span>Mini-games</span></div></div><p class="fine-print">An English-learning spy game.<br>Vocabulary · Grammar · Reading · Critical thinking.</p></footer></div>`;
  }
  const navs = [['maps','grid','Maps'],['rules','book','Game rules'],['leaderboard','trophy','Leaderboard'],['xp','spark','My XP'],['profile','user','Profile']];
  function navigationHTML(bottom=false) {
    const names = {maps:'Maps',rules:'Rules',leaderboard:'Ranks',xp:'My XP',profile:'Agent'};
    return navs.map(([key,icon,label])=>`<button class="${bottom?'':'nav-item '}${tab===key?'selected':''}" data-action="tab" data-tab="${key}" ${tab===key?'aria-current="page"':''}>${i(icon)}<span>${bottom?names[key]:label}</span></button>`).join('');
  }
  function shellHTML(content) {
    return `${storageWarning()}<div class="shell"><aside class="sidebar">${brand()}<div class="nav-label">Command center</div><nav class="side-nav" aria-label="Main navigation">${navigationHTML()}</nav>
    <div class="partner-widget"><div class="partner-head"><span class="status-dot"></span><strong>NOVA // STANDING BY</strong></div><p>“Stay curious, Agent. The smallest detail can open the biggest door.”</p></div><div class="sidebar-footer">${i('shield')}<p>GUEST CLEARANCE<br>Progress saved on this device</p></div></aside>
    <div class="workspace"><header class="topbar"><div class="mobile-brand">${brand()}</div><span class="topbar-title">${screen==='map'?'Maps / '+e(currentMap().name):'Command center / '+e(navs.find(n=>n[0]===tab)[2])}</span><div class="topbar-right"><span class="pill guest-pill"><span class="status-dot"></span> GUEST ACCESS</span><span class="xp-chip" title="Total saved XP">${i('spark')}${fmt(C.total(state))} XP</span><button class="avatar-button" data-action="tab" data-tab="profile" aria-label="Open agent profile">${V.avatar(state.avatar)}</button></div></header><main class="main-content" id="main-content">${content}</main></div>
    <nav class="bottom-nav" aria-label="Mobile navigation">${navigationHTML(true)}</nav></div>`;
  }
  function nextMission() {
    const preferred = D.maps.find(m=>m.id===mapId);
    const m = state.maps[preferred.id].completed.length<5 ? preferred : D.maps.find(m=>state.maps[m.id].completed.length<5);
    return m ? {map:m, level:m.levels[state.maps[m.id].completed.length]} : null;
  }
  function mapsHTML() {
    const next = nextMission();
    return `<div class="page-heading"><div><div class="eyebrow neutral">WELCOME BACK, ${e(state.name.toUpperCase())}</div><h1>Mission control<span class="lime">.</span></h1><p>Three locations. Fifteen escapes. One sharp mind.</p></div><span class="pill heading-side">${C.cleared(state)} / 15 LEVELS COMPLETE</span></div>
    <section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="status-dot"></span>${next?'YOUR NEXT OPERATION':'ALL OPERATIONS COMPLETE'}</div><h2>${next?`${e(next.map.name)} · Level ${next.level.number}: ${e(next.level.location)}`:'Every code. Cracked.'}</h2><p>${next?e(next.level.brief):'All three maps are clear. Return to any completed level to practise your skills.'}</p>${next?`<button class="button primary" data-action="start" data-map="${next.map.id}" data-level="${next.level.number-1}">${state.maps[next.map.id].completed.length?'Continue mission':'Start first mission'} ${i('arrow')}</button>`:`<button class="button primary" data-action="tab" data-tab="profile">View agent profile ${i('arrow')}</button>`}</div><div class="hero-art" aria-hidden="true"><div class="orbit"></div><div class="hero-code"><span>${next?'?':'✓'}</span><span>${next?'?':'✓'}</span><span>${next?'?':'✓'}</span></div></div></section>
    <div class="section-heading"><h2>Choose your operation</h2><p>Play the maps in any order</p></div><div class="map-grid">${D.maps.map((m,idx)=>{const done=state.maps[m.id].completed.length;return `<button class="map-card ${m.theme}" data-action="map" data-map="${m.id}"><div class="map-card-art"><span class="map-serial">OPERATION / 0${idx+1}</span>${V.mapArt(m.id)}<span class="pill">${done===5?'COMPLETE':'AVAILABLE'}</span></div><div class="map-card-body"><div class="map-card-title">${i(m.id)}<h3>${m.name}</h3></div><p>${m.description}</p><div class="map-progress-text"><span>${done} of 5 levels complete</span><span>25 mini-games</span></div><div class="progress-track"><span style="width:${done*20}%"></span></div></div><div class="map-card-link"><span>${done===5?'Revisit map':done?'Continue operation':'Explore map'}</span>${i('arrow')}</div></button>`;}).join('')}</div>${noticeLine()}`;
  }
  function mapHTML() {
    const m = currentMap(), ms = state.maps[m.id];
    return `<button class="text-button" data-action="tab" data-tab="maps">${i('back')} All operations</button><div class="map-page-head"><div><div class="eyebrow">OPERATION 0${D.maps.indexOf(m)+1} / ${e(m.subtitle).toUpperCase()}</div><h1>${m.name}<span class="lime"> map.</span></h1><p>${m.description}</p></div>${V.mapArt(m.id)}</div>
    <div class="stats-row"><div class="stat"><div class="stat-label">${i('spark')}${m.name} XP</div><div class="stat-value">${fmt(ms.xp)}</div></div><div class="stat"><div class="stat-label">${i('flame')}Current streak</div><div class="stat-value">${ms.streak}<small> games</small></div></div><div class="stat"><div class="stat-label">${i('trophy')}Best streak</div><div class="stat-value">${ms.best}<small> games</small></div></div></div>
    <div class="section-heading"><h2>Your mission path</h2><span class="pill">${ms.completed.length} / 5 COMPLETE</span></div><div class="level-list">${m.levels.map((l,n)=>{const completed=ms.completed.includes(n),locked=n>ms.completed.length;return `<button class="level-row ${locked?'locked':completed?'complete':'ready'}" data-action="start" data-map="${m.id}" data-level="${n}" ${locked?'disabled':''}><span class="level-number">${locked?i('lock'):completed?i('check'):'0'+(n+1)}</span><span class="level-text"><h3>${e(l.location)}</h3><p>${e(l.brief)}</p><span class="level-meta"><span>${e(l.title)}</span><span>·</span><span>5 mini-games + escape</span><span>·</span><span>${completed?'Practice · no new XP':fmt(C.levelValue(l))+' XP'}</span>${locked?'<span>· Complete Level '+n+' first</span>':''}</span></span><span class="level-action">${locked?i('lock'):`<span>${completed?'Replay':'Begin'}</span>${i('arrow')}`}</span></button>`;}).join('')}</div>${noticeLine()}`;
  }
  function rulesHTML() {
    const block=(icon,title,body)=>`<section class="rule-block"><h3>${i(icon)}${title}</h3>${body}</section>`;
    const S=C.SCORE;
    return `<div class="page-heading"><div><div class="eyebrow neutral">AGENT HANDBOOK</div><h1>Know the rules<span class="lime">.</span></h1><p>The complete game rules are available only here in the Lobby. Read them before you select a map or start a mission.</p></div></div>
    <div class="rules-grid">
    ${block('grid','Maps & levels','<p>There are three maps: School, Hotel, and Hospital. Each map has 5 levels. Each level has 5 mini-games and one Escape Stage.</p><p>Complete Mini-games 1–5 in order, then the Escape Stage, to unlock the next level. You can switch maps at any time, but you cannot skip a level within the same map.</p>')}
    ${block('target','Mini-games','<p>Mini-games practise vocabulary, spelling, reading, grammar, sentence building, observation, clue analysis, memory, and critical thinking. They include Memory Cards, Object Search, True or False, Speed Sort, Hangman, Missing Letter, Word Puzzle, Quick Choice, Odd One Out, Chat Reply, Spot the Error, Crossword, Two Truths One Lie, and more.</p><p>English is the main language. There are no listening activities.</p>')}
    ${block('time','No time limit · Quick Answer Bonus',`<p>Mini-games have no time limit. You cannot lose for reading, thinking, or answering slowly.</p><p>If you submit a correct answer within ${C.QUICK_SECONDS} seconds of a question starting, you earn a Quick Answer Bonus of +${S.quick} XP. This is not a countdown: after ${C.QUICK_SECONDS} seconds a correct answer still earns normal XP. A wrong answer, or using a hint, cancels the bonus for that question. The time resets for every new question.</p>`)}
    ${block('light','Hints','<p>Hints are available only in Object Search on Levels 4–5. You can use one hint per mini-game; a hint highlights one remaining object. Using a hint cancels the Quick Answer Bonus for that item.</p><p>Object Search on Levels 1–3 and all other mini-games have no hints.</p>')}
    ${block('spark','XP',`<p>Each question answered correctly on the first try earns +${S.item} XP, plus +${S.quick} XP for a quick answer. Finishing a mini-game earns +${S.game} XP, and passing the Escape Stage earns +${S.escape} XP. Wrong answers never take XP away.</p><p>The Lobby shows your Total XP. Open a map to see its own XP, current streak, and highest streak.</p>`)}
    ${block('flame','Streaks','<p>Streaks are tracked separately for each map. Each completed mini-game adds +1 to that map’s streak, and your latest streak is saved immediately, even if you leave a level.</p><p>Three incorrect escape codes reset that map’s current streak to 0. Your highest streak never decreases.</p>')}
    ${block('chat','Nova, Zero & the secret numbers','<p>Before each level, Nova and Zero explain the mission. After each mini-game they send a message. If that mini-game hid a secret number, they announce it. The team channel is read only.</p><p>Each level hides three single-digit secret numbers in three different mini-games, and the hiding places change from level to level. Remember the numbers in the order they are announced: the first number found is the first digit of the code, the second is the second digit, and the last is the third digit. The team never shows the complete code before the Escape Stage.</p>')}
    ${block('lock','The Escape Stage','<p>Enter the three numbers in the order Nova and Zero announced them: the first number announced is the first digit, the second is the second digit, and the last is the third digit. You have a maximum of three attempts, and each one asks you to confirm before it is submitted.</p><p>A correct code completes the level, saves its XP and streak, and unlocks the next level. Three incorrect codes restart the level from Mini-game 1: the XP from that attempt is lost, but previously completed levels are not affected.</p>')}
    ${block('shield','Leaving a mission & saving','<p>Press EXIT MISSION during a mini-game or the Escape Stage. You can choose STAY IN MISSION or LEAVE MISSION. If you leave, XP from the unfinished level is not saved, but your latest mini-game streak is saved and you return to the Lobby.</p><p>Leaving after a successful escape keeps everything: level XP, streak, map progress, and the unlocked next level.</p>')}
    </div><details class="rules-details"><summary>Badges, leaderboard & guest data</summary><p><strong>Badges</strong> are earned for your first mini-game, first level, a 5-game streak, 1,000 total XP, completing each map, and completing all 15 levels. They are shown on your Profile.</p><p><strong>Leaderboard:</strong> XP and Streak categories. There is no HP system and no HP leaderboard. This guest edition ranks only the profile saved in this browser.</p><p><strong>Saving:</strong> progress is saved in this browser only. Use Agent settings to export a backup or import it into another browser. Completed levels can be replayed for practice; practice does not change saved XP, streaks, or badges.</p></details>${noticeLine()}`;
  }
  function leaderboardHTML() {
    const val = boardTab==='xp' ? C.total(state) : state.maps[boardMap].best;
    return `<div class="page-heading"><div><div class="eyebrow neutral">LOCAL LEADERBOARD</div><h1>Agent rankings<span class="lime">.</span></h1><p>Your real guest record. No simulated players or scores.</p></div></div><div class="segmented" role="group" aria-label="Leaderboard category"><button data-action="board-tab" data-value="xp" class="${boardTab==='xp'?'selected':''}">XP leaderboard</button><button data-action="board-tab" data-value="streak" class="${boardTab==='streak'?'selected':''}">Streak leaderboard</button></div>
    ${boardTab==='streak'?`<div style="margin-top:14px" class="segmented" role="group" aria-label="Streak map">${D.maps.map(m=>`<button data-action="board-map" data-map="${m.id}" class="${boardMap===m.id?'selected':''}">${m.name}</button>`).join('')}</div>`:''}
    <div class="board"><div class="game-task-label"><span>RANK / AGENT</span><span>${boardTab==='xp'?'SAVED XP':'BEST MAP STREAK'}</span></div><div class="board-row"><span class="board-rank mono">01</span><div class="board-player"><div class="local-avatar">${V.avatar(state.avatar)}</div><div><h3>${e(state.name)}</h3><p>YOU · LOCAL GUEST</p></div></div><div class="board-score">${fmt(val)}<small>${boardTab==='xp'?'TOTAL XP':e(D.maps.find(m=>m.id===boardMap).name.toUpperCase())+' GAMES'}</small></div></div><p class="board-note">This board includes only the guest profile on this browser. Shared rankings will require accounts and a server; this build does not pretend to have a global leaderboard.</p></div>${noticeLine()}`;
  }
  function xpHTML() {
    return `<div class="page-heading"><div><div class="eyebrow neutral">YOUR PROGRESS, DECODED</div><h1>Every clue counts<span class="lime">.</span></h1><p>Only successfully escaped levels become saved XP.</p></div></div><section class="xp-panel"><div class="eyebrow">TOTAL SAVED XP</div><h2>${fmt(C.total(state))} <small>XP</small></h2><p>Combined across all three maps. Open a map to view its own XP balance.</p>${i('spark')}</section><div class="section-heading"><h2>Completed mission log</h2><p>${C.cleared(state)} levels banked</p></div>${state.history.length?`<div class="history">${state.history.map(h=>`<div class="history-row">${i('unlock')}<div><h4>${e(h.title)}</h4><p>Level ${h.level+1} · ${e(new Date(h.at).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}))}</p></div><strong>+${fmt(h.xp)} XP</strong></div>`).join('')}</div>`:`<div class="empty">${i('lock')}<h3>Your story starts here.</h3><p>Finish five mini-games and crack an escape code to bank your first XP.</p><button class="button primary" data-action="tab" data-tab="maps" style="margin-top:20px">Choose an operation ${i('arrow')}</button></div>`}${noticeLine()}`;

  // Crossword: interlocking grid built from the five answers (spaces removed in the grid).
  function layoutCrossword(words) {
    const key=(r,c)=>r+','+c,grid=new Map(),placed=[];
    const list=words.map((w,n)=>({word:norm(w.answer),n})).sort((a,b)=>b.word.length-a.word.length);
    const step=dir=>dir==='down'?[1,0]:[0,1];
    const fits=(w,r,c,dir)=>{const [dr,dc]=step(dir);let cross=0;
      if(grid.has(key(r-dr,c-dc))||grid.has(key(r+dr*w.length,c+dc*w.length)))return -1;
      for(let k=0;k<w.length;k++){const rr=r+dr*k,cc=c+dc*k,ch=grid.get(key(rr,cc));
        if(ch){if(ch!==w[k])return -1;cross++;}
        else if(grid.has(key(rr+dc,cc+dr))||grid.has(key(rr-dc,cc-dr)))return -1;}
      return cross;};
    const put=(w,r,c,dir)=>{const [dr,dc]=step(dir);for(let k=0;k<w.word.length;k++)grid.set(key(r+dr*k,c+dc*k),w.word[k]);placed.push({n:w.n,word:w.word,r,c,dir,len:w.word.length});};
    put(list[0],0,0,'across');
    for(const w of list.slice(1)){
      let best=null;
      for(const p of placed)for(let j=0;j<p.len;j++)for(let k=0;k<w.word.length;k++){
        if(p.word[j]!==w.word[k])continue;
        const dir=p.dir==='across'?'down':'across',r=p.dir==='across'?p.r-k:p.r+j,c=p.dir==='across'?p.c+j:p.c-k,s=fits(w.word,r,c,dir);
        if(s>0&&(!best||s>best.s))best={r,c,dir,s};
      }
      if(best)put(w,best.r,best.c,best.dir);
      else{const rows=[...grid.keys()].map(k=>+k.split(',')[0]),cols=[...grid.keys()].map(k=>+k.split(',')[1]);put(w,Math.max(...rows)+2,Math.min(...cols),'across');}
    }
    const rs=placed.flatMap(p=>[p.r,p.r+(p.dir==='down'?p.len-1:0)]),cs=placed.flatMap(p=>[p.c,p.c+(p.dir==='across'?p.len-1:0)]);
    const r0=Math.min(...rs),c0=Math.min(...cs),cells=new Map();
    placed.forEach(p=>{p.r-=r0;p.c-=c0;p.cells=[];const [dr,dc]=step(p.dir);
      for(let k=0;k<p.len;k++){const id=key(p.r+dr*k,p.c+dc*k);p.cells.push(id);const cell=cells.get(id)||{ch:p.word[k],words:[],nums:[]};cell.words.push(p.n);if(!k)cell.nums.push(p.n+1);cells.set(id,cell);}});
    return {placed:placed.sort((a,b)=>a.n-b.n),cells,rows:Math.max(...rs)-r0+1,cols:Math.max(...cs)-c0+1};
  }
  function crosswordHTML() {

  function cwWordFor(id){const L=play.cw,act=L.placed[play.cwActive];if(act&&act.cells.includes(id))return act;return L.placed.find(p=>p.cells.includes(id)&&!play.cwDone.includes(p.n))||L.placed.find(p=>p.cells.includes(id));}

  }
  function syncCode(){run.codeInput.forEach((x,n)=>{const input=$(`[data-digit="${n}"]`);if(input&&input.tagName==='INPUT')input.value=x;});}
  function codeDigit(d) {if(!run||run.phase!=='escape')return;const next=run.codeInput.findIndex(v=>!v);if(next>=0)run.codeInput[next]=String(d);syncCode();}
  function codeBack(){for(let n=2;n>=0;n--)if(run.codeInput[n]){run.codeInput[n]='';break;}syncCode();}
  function confirmCode() {
    if(!run||run.phase!=='escape')return;
    const code=run.codeInput.join('');
    if(!/^\d{3}$/.test(code)){toast('Enter all three digits before submitting.',true);return;}
    const texts=['Are you sure this is the correct code?','The code may be incorrect. Are you sure you want to submit it?','This is your final attempt. Are you sure?'];
    openModal(run.attempts===2?'Final attempt':'Confirm access code',`<div class="modal-code">${code}</div><p>${texts[run.attempts]}</p>${run.attempts===2?'<div class="modal-warning">A third incorrect code restarts this level from Mini-game 1 and discards its pending XP. Previously completed levels stay safe.</div>':''}<div class="modal-actions"><button class="button secondary" data-action="close-modal">Edit code</button><button class="button ${run.attempts===2?'danger':'primary'}" data-action="confirm-code">Confirm code</button></div>`,'code');
  }
  function submitCode() {
    if(!run||run.phase!=='escape'||dialogMode!=='code')return;
    const code=run.codeInput.join('');closeModal();
    const result=C.submitEscape(state,run,code,currentLevel().code,`${currentMap().name} L${run.level+1} · ${currentLevel().location}`);
    if(result.ok){run.reward=result.xp;say('Nova','ACCESS GRANTED. Excellent work, Agent! You have unlocked the next Level.');storageRemove(ACTIVE_KEY);}
    else if(result.failed){say('Zero','Three incorrect codes. This level must restart from Mini-game 1. Previously completed levels are safe.');storageRemove(ACTIVE_KEY);}
    else {run.escapeError=`Incorrect code. Please review your evidence and try again. Attempts remaining: ${result.remaining}.`;run.codeInput=['','',''];}
    save();render();scrollTop();
  }
  function resultHTML() {
    if(run.phase==='failed')return `<section class="mission-card final-result failed"><div class="success-mark">${i('lock')}</div><div class="eyebrow neutral" style="justify-content:center">SECURITY RESET</div><h2>Access denied.</h2><p>Three incorrect codes. This level’s pending XP has been discarded. You must replay all five mini-games before the next escape attempt.</p><p>Previously completed levels, banked XP, and your highest streak are unaffected.</p><div class="button-row"><button class="button primary" data-action="restart-level">${i('reset')} Restart level</button><button class="button secondary" data-action="result-lobby">Return to lobby</button></div></section>`;
    const hasNext=run.level<4;
    return `<section class="mission-card final-result"><div class="success-mark">${i('unlock')}</div><div class="eyebrow" style="justify-content:center">${run.practice?'PRACTICE COMPLETE':'MISSION ACCOMPLISHED'}</div><h2>ACCESS GRANTED.</h2><p>Excellent work, Agent! You completed<br><strong>Level ${run.level+1} · ${e(currentLevel().location)}.</strong></p><div class="result-xp">+${fmt(run.reward)} <small>XP</small></div><p>${run.practice?'Practice score only. Your saved progress has not changed.':'Saved. Your mission progress and XP are now secure.'}</p><div class="result-stats"><div><strong>5 / 5</strong><span>MINI-GAMES COMPLETE</span></div><div><strong>${run.attempts+1} / 3</strong><span>ESCAPE ATTEMPT</span></div></div>${!run.practice?`<div class="reveal-line">${hasNext?'Level '+(run.level+2)+' unlocked. Your next operation is ready.':currentMap().name+' map complete. Specialist badge earned.'}</div>`:''}<div class="button-row">${hasNext?`<button class="button primary" data-action="next-level">Next level ${i('arrow')}</button>`:''}<button class="button ${hasNext?'secondary':'primary'}" data-action="result-lobby">Choose another map ${i('grid')}</button></div></section>`;
  }
  function restartLevel() {const id=run.mapId,n=run.level;stopTimer();clearTimeout(transferTimer);run=null;play=null;beginMission(id,n);}
  function nextLevel() {if(!run||run.phase!=='success'||run.level>=4)return;const id=run.mapId,n=run.level+1;run=null;play=null;beginMission(id,n);}
  function openModal(title,content,mode='',wide=false) {
    modalReturnFocus=document.activeElement;dialogMode=mode;
    modalRoot.innerHTML=`<div class="modal-backdrop"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="modal-title"><header class="modal-header"><h2 id="modal-title">${e(title)}</h2><button class="icon-button" data-action="close-modal" aria-label="Close dialog">${i('x')}</button></header><div class="modal-content">${content}</div></section></div>`;
    document.body.style.overflow='hidden';
    setTimeout(()=>{const b=modalRoot.querySelector('button,input');if(b)b.focus();},0);
  }
  function closeModal() {
    modalRoot.innerHTML='';dialogMode='';document.body.style.overflow='';
    if(modalReturnFocus&&document.contains(modalReturnFocus))modalReturnFocus.focus({preventScroll:true});
  }
  function askExit() {
    if(!run)return;
    if(['success','failed'].includes(run.phase)){leaveMission();return;}
    openModal('Leave this mission?',`<p>Are you sure you want to escape from this mission?</p><div class="modal-warning">Your XP from the unfinished level will not be saved. Your latest mini-game streak will still be saved.<br><strong>${fmt(pendingNow())} pending XP will be discarded.</strong></div><div class="modal-actions"><button class="button secondary" data-action="close-modal">Stay in mission</button><button class="button danger" data-action="leave-mission">Leave mission</button></div>`,'exit');
  }
  function showIntel() {
    if(!run)return;
    openModal('Team channel',`<p class="settings-intro">Messages from Nova and Zero. You can reply only after Mini-game 5.</p><div class="intel-modal-log" id="intel-modal-log">${chatHTML()}</div>`,'intel',true);
    const log=$('#intel-modal-log');if(log)log.scrollTop=log.scrollHeight;
  }
  function settingsHTML() {
    const groups=[['shirt','Shirt',['#bcf578','#8bc9ff','#cfadff'],['Field green','Sky blue','Violet']],['hair','Hair',[0,1,2,3],['Side sweep','Long','Curly','Close crop']],['face','Face',['#e8b78e','#b77c55','#80513c'],['Light','Medium','Dark']],['pants','Pants',['#222f42','#435467','#573e67'],['Navy','Slate','Plum']]];
    return `<p class="settings-intro">One guest profile, saved on this browser. No password or account required.</p><label class="field-label" for="settings-name">AGENT NAME</label><input class="text-input" id="settings-name" value="${e(draftName)}" maxlength="24" autocomplete="nickname"><div class="settings-avatar"><div class="settings-portrait">${V.avatar(draftAvatar)}</div><div class="avatar-options">${groups.map(([key,label,values,names])=>`<div class="avatar-option-row"><label>${label}</label><div class="swatches" role="group" aria-label="${label}">${values.map((v,n)=>`<button class="swatch ${key==='hair'?'text-swatch':''} ${draftAvatar[key]===n?'chosen':''}" ${key==='hair'?'':`style="--swatch:${v}"`} data-action="avatar-option" data-part="${key}" data-value="${n}" aria-label="${label}: ${names[n]}" aria-pressed="${draftAvatar[key]===n}">${key==='hair'?String(n+1):''}</button>`).join('')}</div></div>`).join('')}</div></div><button class="button primary full settings-save" data-action="save-profile">Save agent ${i('check')}</button><div class="divider"></div><h3 style="font-size:15px">Keep your progress safe</h3><div class="backup-actions"><button class="button secondary" data-action="export">${i('download')} Export progress</button><button class="button secondary" data-action="import" ${run?'disabled':''}>${i('upload')} Import progress</button></div><p class="fine-print">A backup transfers saved levels, XP, streaks, badges, and your avatar. Unfinished level XP is not included.${run?' Return to the lobby before importing or resetting.':''}</p><div class="settings-danger"><p>Reset removes this browser’s guest profile and saved progress.</p><button class="text-button" data-action="reset-confirm" ${run?'disabled':''}>Reset guest data</button></div>`;
  }
  function openSettings() {
    if(!state){toast('Enter as guest first, then open Agent settings.');return;}
    draftAvatar={...state.avatar};draftName=state.name;
    openModal('Agent settings',settingsHTML(),'settings',true);
  }
  function updateAvatar(part,value) {
    if(dialogMode!=='settings'||!['shirt','hair','face','pants'].includes(part))return;
    draftName=$('#settings-name').value;draftAvatar[part]=value;
    const content=modalRoot.querySelector('.modal-content');content.innerHTML=settingsHTML();
    const chosen=content.querySelector(`[data-part="${part}"][data-value="${value}"]`);if(chosen)chosen.focus({preventScroll:true});
  }
  function saveProfile() {
    if(dialogMode!=='settings')return;
    state.name=($('#settings-name').value.trim()||'Guest Agent').slice(0,24);
    state.avatar={...draftAvatar};save();closeModal();render();toast('Agent profile saved.');
  }
  function exportProgress() {
    if(!state)return;
    const data=JSON.stringify(state,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob);
    const link=document.createElement('a');link.href=url;link.download='CODE_BREAKERS_Guest_Backup.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);
    toast('Progress backup created. Unfinished XP is not included.');
  }
  let pendingImport=null;
  async function readImport(file) {
    if(!file||run)return;
    if(file.size>100000){toast('That file is too large to be a guest progress backup.',true);return;}
    try{const imported=C.validate(JSON.parse(await file.text()));pendingImport=imported;openModal('Import guest progress?',`<p>Replace this browser’s saved guest progress with the backup for <strong>${e(imported.name)}</strong>?</p><div class="modal-warning">${C.cleared(imported)} completed levels · ${fmt(C.total(imported))} saved XP.<br>Your current local profile will be replaced. Export it first to keep a copy.</div><div class="modal-actions"><button class="button secondary" data-action="close-modal">Cancel</button><button class="button primary" data-action="confirm-import">Import backup</button></div>`,'import');}
    catch(err){toast('Import rejected. '+err.message,true);}
  }
  function confirmImport() {if(run||dialogMode!=='import'||!pendingImport)return;state=pendingImport;pendingImport=null;save();storageRemove(ACTIVE_KEY);closeModal();screen='lobby';tab='profile';render();scrollTop();toast('Guest progress imported.');}
  function askReset() {
    if(run)return;
    openModal('Reset guest data?',`<p>This deletes the guest profile, avatar, saved XP, streaks, badges, and completed levels on this browser. It cannot be undone without a backup.</p><div class="modal-actions"><button class="button secondary" data-action="close-modal">Keep progress</button><button class="button danger" data-action="reset-data">Delete guest data</button></div>`,'reset');
  }
  function resetData() {
    if(run||dialogMode!=='reset')return;
    storageRemove(KEY);storageRemove(ACTIVE_KEY);state=null;pendingImport=null;closeModal();screen='entry';tab='maps';mapId='school';render();scrollTop();toast('Guest data reset.');
  }
  const actions={
    guest:enterGuest,
    tab:b=>goTab(b.dataset.tab),
    map:b=>goMap(b.dataset.map),
    start:b=>beginMission(b.dataset.map,Number(b.dataset.level)),
    'open-game':startGame,
    match:b=>match(b.dataset.side,Number(b.dataset.n)),
    'read-start':()=>{if(run?.phase==='playing'&&!play.readStarted){play.readStarted=true;questionStart();render();scrollTop();}},
    flip:b=>flip(b.dataset.side,Number(b.dataset.n)),
    letter:b=>guessLetter(b.dataset.letter),
    'spell-check':spellCheck,
    'spell-next':spellNext,
    'sort-pick':b=>sortPick(Number(b.dataset.n)),
    'sort-place':b=>sortPlace(Number(b.dataset.cat)),
    'sort-check':sortCheck,
    'cw-clue':b=>cwClue(Number(b.dataset.n)),
    'cw-check':cwCheck,
    answer:b=>answer(Number(b.dataset.n)),
    'question-next':questionNext,
    word:b=>word(Number(b.dataset.key)),
    unword:b=>word(Number(b.dataset.key),true),
    'clear-words':()=>{if(play&&!play.done){play.chosen=[];play.error='';play.good='';render();}},
    'check-words':checkWords,
    'sentence-next':sentenceNext,
    object:b=>chooseObject(b.dataset.object),
    hint,
    'next-game':nextGame,
    'escape-now':enterEscape,
    digit:b=>codeDigit(b.dataset.digit),
    'clear-code':()=>{if(run?.phase==='escape'){run.codeInput=['','',''];syncCode();}},
    'back-code':codeBack,
    'submit-code':confirmCode,
    'confirm-code':submitCode,
    exit:askExit,
    'leave-mission':leaveMission,
    'restart-level':restartLevel,
    'next-level':nextLevel,
    'result-lobby':leaveMission,
    'close-modal':closeModal,
    intel:showIntel,
    settings:openSettings,
    'avatar-option':b=>updateAvatar(b.dataset.part,Number(b.dataset.value)),
    'save-profile':saveProfile,
    export:exportProgress,
    import:()=>{if(!run)$('#import-file').click();},
    'confirm-import':confirmImport,
    'reset-confirm':askReset,
    'reset-data':resetData,
    'board-tab':b=>{boardTab=b.dataset.value;render();},
    'board-map':b=>{boardMap=b.dataset.map;render();}
  };
  function onClick(event) {
    // Speed Sort: tapping anywhere in a category (or the word list) drops the selected word there.
    const zone=event.target.closest('[data-drop]');
    if(zone&&!event.target.closest('button')&&run?.phase==='playing'&&play?.sel!=null){sortPlace(Number(zone.dataset.drop));return;}
    const b=event.target.closest('button[data-action]');
    if(!b||b.disabled)return;
    const action=actions[b.dataset.action];
    if(action){try{action(b);}catch(err){console.error(err);toast('The action could not be completed. Please try again.',true);}}
  }
  app.addEventListener('click',onClick);modalRoot.addEventListener('click',onClick);
  app.addEventListener('input',event=>{
    const input=event.target;
    if(input.matches('input[data-digit]')&&run?.phase==='escape'){
      const n=Number(input.dataset.digit),digits=input.value.replace(/\D/g,'');
      run.codeInput[n]=digits.slice(-1);input.value=run.codeInput[n];
      if(run.codeInput[n]&&n<2){const next=$(`input[data-digit="${n+1}"]`);next.focus();next.select();}
    }
    if(input.matches('input[data-cw]')&&run?.phase==='playing')cwInput(input);
    if(input.matches('input[data-blank]')&&run?.phase==='playing'){
      input.value=(input.value.toUpperCase().match(/[A-Z]/g)||['']).pop();
      play.typed=[...document.querySelectorAll('[data-blank]')].map(x=>x.value||' ').join('');
      if(input.value){const next=$(`input[data-blank="${Number(input.dataset.blank)+1}"]`);if(next){next.focus();next.select();}}
    }
  });
  // Speed Sort drag and drop (mouse); touch players use tap-to-select, tap-to-place.
  app.addEventListener('dragstart',event=>{
    const chip=event.target.closest?.('.sort-chip');if(!chip||!play)return;
    play.sel=Number(chip.dataset.n);event.dataTransfer.setData('text/plain',chip.dataset.n);event.dataTransfer.effectAllowed='move';
  });
  app.addEventListener('dragover',event=>{const z=event.target.closest?.('[data-drop]');if(z&&play?.sel!=null){event.preventDefault();z.classList.add('drag-over');}});
  app.addEventListener('dragleave',event=>{const z=event.target.closest?.('[data-drop]');if(z)z.classList.remove('drag-over');});
  app.addEventListener('drop',event=>{
    const z=event.target.closest?.('[data-drop]');if(!z||!play)return;event.preventDefault();
    const n=Number(event.dataTransfer.getData('text/plain'));if(Number.isInteger(n))play.sel=n;
    sortPlace(Number(z.dataset.drop));
  });
  app.addEventListener('paste',event=>{
    if(!event.target.matches('input[data-digit]')||run?.phase!=='escape')return;
    const digits=(event.clipboardData?.getData('text')||'').replace(/\D/g,'').slice(0,3);
    if(!digits)return;event.preventDefault();run.codeInput=[digits[0]||'',digits[1]||'',digits[2]||''];syncCode();
  });
  $('#import-file').addEventListener('change',event=>{readImport(event.target.files[0]);event.target.value='';});
  document.addEventListener('keydown',event=>{
    if(dialogMode){
      if(event.key==='Escape'){event.preventDefault();closeModal();return;}
      if(event.key==='Tab'){
        const nodes=[...modalRoot.querySelectorAll('button:not(:disabled),input:not(:disabled),a[href],summary')].filter(n=>n.getClientRects().length);
        const first=nodes[0],last=nodes[nodes.length-1];
        if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
        else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
      }return;
    }
    if(screen==='entry'&&event.key==='Enter'&&event.target.id==='guest-name'){event.preventDefault();enterGuest();return;}
    if(run?.phase==='escape'){
      if(event.target.matches('input[data-digit]')){
        const n=Number(event.target.dataset.digit);
        if(event.key==='Backspace'&&!event.target.value&&n>0){event.preventDefault();run.codeInput[n-1]='';syncCode();$(`input[data-digit="${n-1}"]`).focus();}
        if(event.key==='Enter'){event.preventDefault();confirmCode();}
      }else if(/^\d$/.test(event.key)){event.preventDefault();codeDigit(event.key);}
      else if(event.key==='Backspace'){event.preventDefault();codeBack();}
      else if(event.key==='Enter'&&!event.target.closest('button')){event.preventDefault();confirmCode();}
    }
    if(event.key==='Enter'&&event.target.id==='spell-input'){event.preventDefault();if(play?.questionAnswered)spellNext();else spellCheck();return;}
    if(event.target.matches?.('input[data-blank]')){
      if(event.key==='Enter'){event.preventDefault();spellCheck();return;}
      if(event.key==='Backspace'&&!event.target.value){const prev=$(`input[data-blank="${Number(event.target.dataset.blank)-1}"]`);if(prev){event.preventDefault();prev.value='';prev.focus();}}
    }
    if(event.target.matches?.('input[data-cw]')){
      if(event.key==='Enter'){event.preventDefault();cwCheck();return;}
      if(event.key==='Backspace')cwBack(event.target);
    }
    if(run?.phase==='playing'&&!event.target.matches('input')&&!event.ctrlKey&&!event.metaKey&&!event.altKey){
      const g=currentGame();
      if(g.type==='sort'&&play.sel!==null&&/^[1-9]$/.test(event.key)&&Number(event.key)<=g.categories.length){event.preventDefault();sortPlace(Number(event.key)-1);}
      if(g.type==='hangman'&&/^[a-z]$/i.test(event.key)){event.preventDefault();guessLetter(event.key.toUpperCase());}
    }
  });
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateQuick();});
  window.addEventListener('beforeunload',event=>{
    if(run&&!['success','failed'].includes(run.phase)) { save();markActive();event.preventDefault();event.returnValue=''; }
  });
  // Read-only snapshots are useful for integration checks; no unlock or score-writing API is exposed.
  window.CB_APP=Object.freeze({getState:()=>state?JSON.parse(JSON.stringify(state)):null,getRun:()=>run?JSON.parse(JSON.stringify(run)):null});
  render();
  if(recoveryMessage&&screen==='entry')setTimeout(()=>toast(recoveryMessage,true),450);
})();

</script>
</body>
</html>
